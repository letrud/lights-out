<title>Lights-out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --paper:#f0f0f1;
  --paper-2:#e4e4e6;
  --glass:rgba(255,255,255,.66);
  --glass-2:rgba(255,255,255,.45);
  --glass-hi:rgba(255,255,255,.9);
  --stroke:rgba(22,23,26,.11);
  --stroke-2:rgba(22,23,26,.07);
  --ink:#17181c;
  --ink-2:#53555c;
  --ink-3:#87898f;
  --accent:#2a4fe6;
  --accent-ink:#1c37a8;
  --accent-wash:rgba(42,79,230,.10);
  --ok:#0f8a5f;
  --ok-wash:rgba(15,138,95,.13);
  --warn:#b5751a;
  --warn-wash:rgba(181,117,26,.15);
  --crit:#ce3b43;
  --crit-wash:rgba(206,59,67,.13);
  --idle:#8a8c92;
  --idle-wash:rgba(138,140,146,.16);
  --shadow-lift:0 1px 2px rgba(18,19,22,.05),0 8px 24px -10px rgba(18,19,22,.20);
  --shadow-pop:0 2px 6px rgba(18,19,22,.07),0 24px 48px -16px rgba(18,19,22,.28);
  --grid-line:rgba(30,31,36,.05);
  --lift-hi:rgba(255,255,255,.85);
  --r-lg:16px; --r-md:11px; --r-sm:7px;
  --rail:68px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0c0d0f;
    --paper-2:#131417;
    --glass:rgba(238,240,244,.062);
    --glass-2:rgba(238,240,244,.04);
    --glass-hi:rgba(255,255,255,.09);
    --stroke:rgba(238,240,244,.13);
    --stroke-2:rgba(238,240,244,.07);
    --ink:#ecedee;
    --ink-2:#a9aab0;
    --ink-3:#76787e;
    --accent:#7d97ff;
    --accent-ink:#a8bcff;
    --accent-wash:rgba(125,151,255,.16);
    --ok:#3ec48d;
    --ok-wash:rgba(62,196,141,.15);
    --warn:#e0a341;
    --warn-wash:rgba(224,163,65,.16);
    --crit:#ff6b72;
    --crit-wash:rgba(255,107,114,.15);
    --idle:#76787e;
    --idle-wash:rgba(130,133,140,.18);
    --shadow-lift:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
    --shadow-pop:0 2px 8px rgba(0,0,0,.5),0 28px 60px -18px rgba(0,0,0,.8);
    --grid-line:rgba(232,236,244,.05);
    --lift-hi:rgba(255,255,255,.045);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c0d0f; --paper-2:#131417;
  --glass:rgba(238,240,244,.062); --glass-2:rgba(238,240,244,.04); --glass-hi:rgba(255,255,255,.09);
  --stroke:rgba(238,240,244,.13); --stroke-2:rgba(238,240,244,.07);
  --ink:#ecedee; --ink-2:#a9aab0; --ink-3:#76787e;
  --accent:#7d97ff; --accent-ink:#a8bcff; --accent-wash:rgba(125,151,255,.16);
  --ok:#3ec48d; --ok-wash:rgba(62,196,141,.15);
  --warn:#e0a341; --warn-wash:rgba(224,163,65,.16);
  --crit:#ff6b72; --crit-wash:rgba(255,107,114,.15);
  --idle:#76787e; --idle-wash:rgba(130,133,140,.18);
  --shadow-lift:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
  --shadow-pop:0 2px 8px rgba(0,0,0,.5),0 28px 60px -18px rgba(0,0,0,.8);
  --grid-line:rgba(232,236,244,.05);
  --lift-hi:rgba(255,255,255,.045);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
/* blueprint ground + light haze behind the glass */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 700px at 18% -10%, var(--lift-hi), transparent 66%),
    radial-gradient(900px 600px at 88% 2%, var(--lift-hi), transparent 62%),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/34px 34px,
    linear-gradient(170deg, var(--paper) 0%, var(--paper-2) 100%);
}
::selection{background:var(--accent-wash);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ============ glass primitive ============ */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.04);
  backdrop-filter:blur(18px) saturate(1.04);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow-lift), inset 0 1px 0 var(--glass-hi);
}

/* ============ icon rail ============ */
.rail{
  position:fixed; left:12px; top:12px; bottom:12px; width:var(--rail);
  border-radius:22px; z-index:60;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:12px 0;
}
.brand{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%, var(--ok)));
  color:#fff; box-shadow:0 6px 16px -6px var(--accent); flex:none; margin-bottom:10px;
}
.rail-sep{width:26px;height:1px;background:var(--stroke);margin:8px 0;flex:none}
.rail-spacer{flex:1}
.nav-btn{
  position:relative; width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;color:var(--ink-3); flex:none;
  transition:color .15s ease, background .15s ease, transform .15s ease;
}
.nav-btn:hover{color:var(--ink);background:var(--glass-2)}
.nav-btn[aria-current="true"]{color:var(--accent);background:var(--accent-wash)}
.nav-btn[aria-current="true"]::before{
  content:""; position:absolute; left:-12px; top:12px; width:3px; height:20px;
  border-radius:0 3px 3px 0; background:var(--accent);
}
.nav-btn .dot{
  position:absolute; top:8px; right:8px; width:6px;height:6px;border-radius:50%;
  background:var(--crit); box-shadow:0 0 0 2px var(--paper);
}
.nav-btn .tip{
  position:absolute; left:calc(100% + 14px); top:50%; transform:translateY(-50%) translateX(-4px);
  background:var(--ink); color:var(--paper); padding:5px 9px; border-radius:7px;
  font-size:11.5px; font-weight:600; white-space:nowrap; letter-spacing:.01em;
  opacity:0; pointer-events:none; transition:opacity .14s ease, transform .14s ease; z-index:5;
}
.nav-btn:hover .tip,.nav-btn:focus-visible .tip{opacity:1;transform:translateY(-50%) translateX(0)}
svg{display:block}

/* ============ page frame ============ */
.shell{padding:12px 20px 40px calc(var(--rail) + 30px); max-width:1680px}
header.top{
  display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap;
  padding:14px 2px 18px;
}
.eyebrow{
  font-family:"Archivo",sans-serif; font-size:10.5px; font-weight:600;
  letter-spacing:.17em; text-transform:uppercase; color:var(--ink-3);
}
h1{
  font-family:"Archivo",sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,31px);
  letter-spacing:-.022em; margin:2px 0 0; text-wrap:balance;
}
.top-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok-wash)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition-duration:.01ms!important}}
.chip-static{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--stroke); background:var(--glass-2); font-size:12px; color:var(--ink-2);
}

/* ============ fleet band ============ */
.band{
  border-radius:var(--r-lg); padding:16px 18px; margin-bottom:18px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:2px;
}
.band-cell{padding:2px 18px 2px 0; border-right:1px solid var(--stroke-2); min-width:0}
.band-cell:last-child{border-right:0}
.band-k{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-family:"Archivo",sans-serif}
.band-v{font-family:"Archivo",sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums}
.band-v small{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.band-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stackbar{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:2px;margin-top:9px;background:var(--stroke-2)}
.stackbar i{display:block;height:100%}
.spark{margin-top:6px}

/* ============ toolbar ============ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{
  display:flex;align-items:center;gap:9px;border-radius:11px;padding:0 12px;height:40px;
  flex:1 1 260px; max-width:380px; color:var(--ink-3);
}
.search input{border:0;background:none;outline:none;width:100%;font-size:13.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.seg{display:flex;gap:3px;border-radius:11px;padding:3px}
.seg button{
  padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-2);
  transition:background .15s,color .15s; white-space:nowrap;
}
.seg button:hover{background:var(--glass-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 4px 12px -5px var(--accent)}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0a0f1c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .seg button[aria-pressed="true"]{color:#fff}}
.seg button .cnt{font-size:11px;opacity:.72;margin-left:5px;font-variant-numeric:tabular-nums}
.sel{height:40px;border-radius:11px;padding:0 34px 0 13px;font-size:12.5px;color:var(--ink-2);
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ============ card grid ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(348px,1fr));gap:14px;align-items:start}
.card{
  border-radius:var(--r-lg); padding:15px 16px 14px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; gap:13px; text-align:left; width:100%;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease;
}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sev,var(--idle))}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop),inset 0 1px 0 var(--glass-hi)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.lang{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.card-name{font-family:"Archivo",sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.012em;line-height:1.25}
.card-path{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.squad{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--glass-2);border:1px solid var(--stroke-2);color:var(--ink-2);white-space:nowrap}
.tier{font-family:"Archivo",sans-serif;font-size:10px;font-weight:700;letter-spacing:.09em;padding:3px 6px;border-radius:5px}
.tier.t1{background:var(--crit-wash);color:var(--crit)}
.tier.t2{background:var(--warn-wash);color:var(--warn)}
.tier.t3{background:var(--idle-wash);color:var(--ink-3)}

.row-k{
  font-family:"Archivo",sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px;margin-bottom:7px;
}
.row-k::after{content:"";flex:1;height:1px;background:var(--stroke-2)}
.row-k b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:0;color:var(--ink-2);font-weight:500}

/* pipeline strip */
.stages{display:flex;gap:3px}
.stage{
  flex:1;height:26px;border-radius:6px;display:grid;place-items:center;position:relative;
  font-family:"Archivo",sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid transparent;
}
a.stage{text-decoration:none;cursor:pointer}
a.stage:hover{filter:saturate(1.05) brightness(.97);text-decoration:underline;text-underline-offset:3px}
.tl-link{font-size:11px;font-weight:500;color:var(--accent);text-decoration:none;margin-left:6px}
.tl-link:hover{text-decoration:underline}
.stage.s-ok{background:var(--ok-wash);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.stage.s-warn{background:var(--warn-wash);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.stage.s-crit{background:var(--crit-wash);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.stage.s-idle{background:var(--idle-wash);color:var(--ink-3);border-color:var(--stroke-2)}
.stage.s-idle::before{content:"";position:absolute;inset:0;border-radius:5px;
  background:repeating-linear-gradient(115deg,transparent 0 5px,var(--stroke-2) 5px 6px)}
.stage.s-run{background:var(--accent-wash);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);overflow:hidden}
.stage.s-run::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 22%,transparent),transparent);
  animation:sweep 1.5s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* quality row */
.q-row{display:flex;align-items:center;gap:10px}
.gate{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;
  font-size:11.5px;font-weight:600;white-space:nowrap;
}
.gate.g-ok{background:var(--ok-wash);color:var(--ok)}
.gate.g-warn{background:var(--warn-wash);color:var(--warn)}
.gate.g-crit{background:var(--crit-wash);color:var(--crit)}
.meter{flex:1;min-width:60px}
.meter-track{height:7px;border-radius:4px;background:var(--stroke-2);overflow:hidden;position:relative}
.meter-track i{display:block;height:100%;border-radius:4px;background:var(--bar,var(--accent))}
.meter-track .goal{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink-3);opacity:.55}
.meter-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-bottom:4px}
.meter-lbl b{color:var(--ink-2);font-weight:600}
.vulns{display:flex;gap:5px}
.vuln{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:5px;border:1px solid var(--stroke-2)}
.vuln.v-c{background:var(--crit-wash);color:var(--crit);border-color:transparent}
.vuln.v-h{background:var(--warn-wash);color:var(--warn);border-color:transparent}
.vuln.v-0{color:var(--ink-3)}

/* env pills */
.envs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.env{
  border-radius:9px;padding:7px 8px;border:1px solid var(--stroke-2);background:var(--glass-2);
  display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;
}
.env-k{font-family:"Archivo",sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.env-k i{width:5px;height:5px;border-radius:50%;background:var(--st,var(--idle));flex:none}
.env-v{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.env.stale{border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:var(--warn-wash)}
.env.absent .env-v{color:var(--ink-3)}
.env .flag{position:absolute;top:5px;right:6px;line-height:0}
.env.stale .flag{color:var(--warn)}
.env.ahead .flag{color:var(--ink-3);opacity:.6}

.card-foot{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--stroke-2);padding-top:10px;margin-top:1px}
.card-foot .sep{margin-left:auto}
.card-foot b{color:var(--ink-2);font-weight:600}

/* ============ tables ============ */
.panel{border-radius:var(--r-lg);padding:4px 0;overflow:hidden}
.panel-head{display:flex;align-items:baseline;gap:12px;padding:14px 18px 10px;flex-wrap:wrap}
.panel-head h2{font-family:"Archivo",sans-serif;font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.panel-head p{margin:0;font-size:12px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th{
  font-family:"Archivo",sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:9px 14px;border-bottom:1px solid var(--stroke);white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid var(--stroke-2);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--glass-2)}
td.t-name{font-weight:500}
.dotstate{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.dotstate i{width:7px;height:7px;border-radius:50%;background:var(--st);flex:none}
.matrix-cell{display:flex;flex-direction:column;gap:2px;min-width:86px}
.matrix-cell .mv{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-variant-numeric:tabular-nums}
.matrix-cell .ms{font-size:10px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.matrix-cell .ms i{width:5px;height:5px;border-radius:50%;background:var(--st)}
.lvl{font-family:"Archivo",sans-serif;font-weight:700;font-size:11px;width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center}
.lvl.a{background:var(--ok-wash);color:var(--ok)}
.lvl.b{background:var(--warn-wash);color:var(--warn)}
.lvl.c{background:var(--crit-wash);color:var(--crit)}

/* ============ drawer ============ */
.scrim{position:fixed;inset:0;background:rgba(16,17,20,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:80;opacity:0;transition:opacity .22s ease}
.scrim[hidden]{display:none}
.scrim.in{opacity:1}
.drawer{
  position:fixed;top:12px;right:12px;bottom:12px;width:min(520px,calc(100vw - 24px));
  border-radius:20px;z-index:90;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 20px));transition:transform .28s cubic-bezier(.25,.8,.3,1);
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.04);backdrop-filter:blur(26px) saturate(1.04);
  border:1px solid var(--stroke);box-shadow:var(--shadow-pop),inset 0 1px 0 var(--glass-hi);
}
.drawer[hidden]{display:none}
.drawer.in{transform:translateX(0)}
.dr-head{padding:18px 20px 12px;border-bottom:1px solid var(--stroke-2);display:flex;gap:12px;align-items:flex-start}
.dr-head h2{font-family:"Archivo",sans-serif;font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.dr-close{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);margin-left:auto;flex:none}
.dr-close:hover{background:var(--glass-2);color:var(--ink)}
.dr-tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--stroke-2);overflow-x:auto}
.dr-tabs button{padding:8px 12px 10px;font-size:12.5px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.dr-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dr-body{padding:16px 20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:12.5px}

      const lbl = role === "absent" && !val ? "n/a" : sk === "stale" ? `behind ${refSlot()}` : sk === "ahead" ? "awaiting promotion" : "in sync";
      return `<td><div class="matrix-cell" style="--st:${col(role)}">
        <span class="mv" style="color:${val ? "var(--ink)" : "var(--ink-3)"}">${val ? esc(val) : "none"}</span>
        <span class="ms" style="color:${sk === "stale" ? "var(--warn)" : "var(--ink-3)"}"><i></i>${lbl}</span></div></td>`;
    }).join("");
    return `<tr data-open="${esc(idOf(it))}"><td class="t-name">${esc(labelOf(it))}${U.group ? `<div class="card-path mono">${esc(get(it, U.group.field))}</div>` : ""}</td>${cells}
      ${v.trailing ? `<td>${cell(v.trailing, it)}</td>` : ""}</tr>`;
  }).join("");
  return `${toolbar()}<section class="panel glass">
    <div class="panel-head"><h2>${esc(v.panel || v.title)}</h2>${v.note ? `<p>${esc(v.note)}</p>` : ""}</div>
    <div class="tbl-wrap"><table><thead><tr><th>${esc(U.singular || "item")}</th>${SLOTS.map(s => `<th>${esc(s)}</th>`).join("")}${v.trailing ? `<th>${esc(v.trailing.label)}</th>` : ""}</tr></thead>
    <tbody>${rows}</tbody></table></div></section>`;
}
function cardsView(v){
  const list = filtered();
  const legend = (SPEC.legend || []).map(l => `<span>${l.swatch ? `<i style="background:${col(l.swatch)}"></i>` : ""}${esc(l.label)}</span>`).join("");
  return `${v.band === false ? "" : band()}${toolbar()}` +
    (list.length ? `<div class="grid">${list.map(card).join("")}</div>`
      : `<section class="panel glass"><div class="empty">Nothing matches “${esc(S.q)}”.</div></section>`) +
    (legend ? `<div class="legend">${legend}</div>` : "");
}
function staticView(v){
  return (v.panels || []).map(p => `<section class="panel glass" style="margin-bottom:14px">
    <div class="panel-head"><h2>${esc(p.title)}</h2>${p.note ? `<p>${esc(p.note)}</p>` : ""}</div>
    <div class="tbl-wrap"><table><thead><tr>${p.columns.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead>
    <tbody>${(p.rows || []).map(r => `<tr>${p.columns.map(c => `<td>${cell(c, r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`).join("");
}
function conformanceView(v){
  if (!REQS.length) return `<section class="panel glass"><div class="empty">No standard declared in the intent.</div></section>`;
  const rows = filtered().map(it => {
    const c = conformance(it);
    const cells = REQS.map(r => {
      const verdict = reqVerdict(r, it);
      const tone = {met:"var(--ok)", failed:"var(--crit)", advisory:"var(--warn)", na:"var(--idle)"}[verdict];
      const mark = {met:"✓", failed:"✕", advisory:"!", na:"·"}[verdict];
      return `<td style="text-align:center" title="${esc(r.label)} — ${verdict === "na" ? "not applicable" : verdict}${verdict !== "met" && r.remedy ? ": " + esc(r.remedy) : ""}">
        <span style="display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:12px;
          color:${tone};background:${verdict === "met" ? "var(--ok-wash)" : verdict === "failed" ? "var(--crit-wash)" : verdict === "advisory" ? "var(--warn-wash)" : "transparent"}">${mark}</span></td>`;
    }).join("");
    return `<tr data-open="${esc(idOf(it))}"><td class="t-name">${esc(labelOf(it))}${U.class ? `<div class="card-path mono">${esc(U.class.prefix || "")}${esc(get(it, U.class.field))}</div>` : ""}</td>
      ${cells}<td class="num" style="color:${c.failed ? "var(--crit)" : "var(--ok)"}">${c.met}/${c.applicable}</td></tr>`;
  }).join("");
  return `${toolbar()}<section class="panel glass">
    <div class="panel-head"><h2>${esc(v.panel || v.title)}</h2><p>${esc(v.note || "Each column is a requirement of the declared standard. ✕ is a required gap, ! an advisory one, · not applicable to this class.")}</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>${esc(U.singular || "item")}</th>
      ${REQS.map(r => `<th style="text-align:center" title="${esc(r.label)}">${esc(r.short || r.id)}</th>`).join("")}
      <th>Met</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
const VIEWFN = {cards:cardsView, table:tableView, matrix:matrixView, static:staticView, conformance:conformanceView};

/* ---------- drawer ---------- */
let drawerTab = 0, drawerItem = null;
function openDrawer(id){
  drawerItem = DATA.find(it => String(idOf(it)) === String(id));
  if (!drawerItem) return;
  drawerTab = 0; renderDrawer();
  const d = document.getElementById("drawer"), s = document.getElementById("scrim");
  d.hidden = false; s.hidden = false;
  requestAnimationFrame(() => { d.classList.add("in"); s.classList.add("in"); });
}
function closeDrawer(){
  const d = document.getElementById("drawer"), s = document.getElementById("scrim");
  d.classList.remove("in"); s.classList.remove("in");
  setTimeout(() => { d.hidden = true; s.hidden = true; }, 240);
}
function dimDetail(d, it){
  if (d.render.type === "sequence"){
    const src = get(it, d.render.field) || {};
    return `<div class="timeline">` + (d.render.steps || []).map(st => {
      const role = roleOf(src[st.key]), href = stepLink(d, it, st.key);
      return `<div class="tl-item" style="--st:${col(role)}"><div class="tl-dot"></div><div>
        <div class="tl-t">${esc(st.label || st.key)}${href ? ` <a class="tl-link" href="${esc(href)}" target="_blank" rel="noopener">open ↗</a>` : ""}</div>
        <div class="tl-s">${esc((d.render.stateNotes || {})[src[st.key]] || src[st.key] || "not configured")}</div></div></div>`;
    }).join("") + `</div>`;
  }
  if (d.render.type === "matrix"){
    return `<div class="timeline">` + SLOTS.map(s => {
      const v = slotValue(it, s), sk = skew(it, s);
      const note = !v ? "not present here" : s === refSlot() ? "current reference" :
        sk === "stale" ? `behind ${refSlot()} (${slotValue(it, refSlot())})` :
        sk === "ahead" ? `built, waiting to promote (${refSlot()} runs ${slotValue(it, refSlot())})` : `same as ${refSlot()}`;
      return `<div class="tl-item" style="--st:${col(roleOf(slotState(it, s)))}"><div class="tl-dot"></div><div>
        <div class="tl-t">${esc(s)} — <span class="mono">${v ? esc(v) : "none"}</span></div>
        <div class="tl-s">${esc(note)}</div></div></div>`;
    }).join("") + `</div>`;
  }
  return renderDim(d, it);
}
function renderDrawer(){
  const it = drawerItem, sev = sevOf(it), d = DIMS[drawerTab] || DIMS[0];
  const accent = U.accent ? (U.accent.palette || {})[get(it, U.accent.field)] || "var(--ink-3)" : null;
  const details = (d.details || []).map(f =>
    `<dt>${esc(f.label)}</dt><dd${f.mono ? ' class="mono"' : ""}>${esc(get(it, f.field) ?? "—")}${esc(f.suffix || "")}</dd>`).join("");
  const trend = d.trend && get(it, d.trend.field) ? `<div><div class="row-k">${esc(d.trend.label)}</div>${sparkline(get(it, d.trend.field), col(sev), 440, 60)}</div>` : "";
  document.getElementById("drawer").innerHTML = `
    <div class="dr-head">
      ${accent ? `<span class="lang" style="background:${accent};margin-top:9px"></span>` : ""}
      <div><h2 id="drTitle">${esc(labelOf(it))}</h2>
        ${U.subtitle ? `<div class="card-path mono">${esc(get(it, U.subtitle))}</div>` : ""}
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          ${U.group ? `<span class="squad">${esc(get(it, U.group.field))}</span>` : ""}
          <span class="gate g-${sev === "crit" ? "crit" : sev === "warn" ? "warn" : "ok"}">${esc(SPEC.severityLabels?.[sev] || sev)}</span>
        </div></div>
      <button class="dr-close" type="button" id="drClose" aria-label="Close">${svg(I.close, 17)}</button>
    </div>
    <div class="dr-tabs" role="tablist">${DIMS.map((x, i) => `<button type="button" role="tab" data-tab="${i}" aria-selected="${i === drawerTab}">${esc(x.label)}</button>`).join("")}</div>
    <div class="dr-body">
      <div><div class="row-k">${esc(d.label)}</div>${dimDetail(d, it)}</div>
      ${details ? `<div><div class="row-k">Detail</div><dl class="kv">${details}</dl></div>` : ""}
      ${trend}
    </div>`;
}

/* ---------- render ---------- */
function renderNav(){
  document.getElementById("brand").innerHTML = svg(I[SPEC.brandIcon] || I.box);
  document.getElementById("nav").innerHTML = VIEWS.map(v =>
    `<button class="nav-btn" type="button" data-view="${esc(v.id)}" aria-current="${S.view === v.id}" aria-label="${esc(v.label)}">
      ${svg(I[v.icon] || I.box)}<span class="tip">${esc(v.label)}</span></button>`).join("");
}
function render(){
  const v = VIEWS.find(x => x.id === S.view) || VIEWS[0];
  document.getElementById("viewTitle").textContent = v.title;
  document.getElementById("crumb").textContent = v.crumb || SPEC.eyebrow || "";
  document.getElementById("liveLbl").textContent = SPEC.liveLabel || "Live";
  document.getElementById("view").innerHTML = (VIEWFN[v.type] || cardsView)(v);
  const sel = document.getElementById("sort"); if (sel) sel.value = S.sort;
  renderNav();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("a[href]")) return;
  const nav = e.target.closest("[data-view]");
  if (nav){ S.view = nav.dataset.view; render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  const f = e.target.closest("[data-filter]");
  if (f){ S.filter = f.dataset.filter; render(); return; }
  const open = e.target.closest("[data-open]");
  if (open){ openDrawer(open.dataset.open); return; }
  if (e.target.closest("#drClose") || e.target.id === "scrim"){ closeDrawer(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab){ drawerTab = +tab.dataset.tab; renderDrawer(); return; }
  if (e.target.closest("#themeBtn")){
    const cur = document.documentElement.getAttribute("data-theme");
    const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark"));
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){
    S.q = e.target.value; const pos = e.target.selectionStart; render();
    const q = document.getElementById("q"); if (q){ q.focus(); q.setSelectionRange(pos, pos); }
  }
});
document.addEventListener("change", e => { if (e.target.id === "sort"){ S.sort = e.target.value; render(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("drawer").hidden) closeDrawer();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); document.getElementById("q")?.focus(); }
});
function clock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}) + " · " + (SPEC.syncLabel || "synced");
}
clock(); setInterval(clock, 30000);
render();
</script>

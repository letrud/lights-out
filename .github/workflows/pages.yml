name: Publish control room

# Publishes site/ to GitHub Pages whenever the generated control room changes.
# control-room.html is copied to index.html in the artifact only, so the repo
# keeps a single generated file and the root URL still resolves.
#
# CI regenerates the room with the job token, and pushes made with that token
# do not raise push events — so this also runs after the workflows that do it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_run:
    workflows: ["Intent change", "Collect"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          cp site/*.html _site/
          cp site/control-room.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

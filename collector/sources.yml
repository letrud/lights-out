# Where every field the intent requires actually comes from.
# `collect.py --check` fails if the intent requires a field this file does not declare.
# status: live = a real source · owned = a human owns this value by design
#         todo = carried by hand only because no source exists yet
fleet: software-factory

adapters:
  github_actions:
    note: workflow runs on the default branch, via `gh api`. Which workflow proves which stage is the component's `pipeline` map
  github_deployments:
    note: GitHub Deployments and their statuses. Which deployment environment is which slot is the component's `envMap`
  github_dependabot:
    note: open Dependabot alerts by severity. Alerts must be enabled on the repo, or the last known value is kept
  manual:
    note: maintained by hand in the data file

fields:
  # --- identity, owned by humans
  name:
    adapter: manual
    status: owned
  path:
    adapter: manual
    status: owned
    note: owner/name of the GitHub repo; the adapters key on it
  lang:
    adapter: manual
    status: owned
  squad:
    adapter: manual
    status: owned
  owner:
    adapter: manual
    status: owned
  tier:
    adapter: manual
    status: owned

  # --- automation: workflow runs
  stages:
    adapter: github_actions
    status: live
  auto:
    adapter: github_actions
    status: live
  deploys:
    adapter: github_actions
    status: live
  freq:
    adapter: github_actions
    status: live
  lastDeploy:
    adapter: github_actions
    status: live
  lead:
    adapter: github_actions
    status: live
    note: median commit-to-deploy-complete over the last 10 successful deploy runs
  leadM:
    adapter: github_actions
    status: live
  cfr:
    adapter: github_actions
    status: live
    note: failed deploy runs over all completed deploy runs, last 30 days
  mttr:
    adapter: github_actions
    status: live
    note: mean time from a failed deploy run to the next successful one

  # --- environments: GitHub Deployments
  env:
    adapter: github_deployments
    status: live
  envState:
    adapter: github_deployments
    status: live

  # --- quality: no analysis platform is wired yet. Unknown is null, never a guess
  vuln:
    adapter: github_dependabot
    status: live
  cov:
    adapter: manual
    status: todo
    note: needs a coverage tool publishing per repo; nothing measures coverage today
  covTrend:
    adapter: manual
    status: todo
    note: follows cov
  gate:
    adapter: manual
    status: todo
    note: no quality gate exists yet
  debt:
    adapter: manual
    status: todo
    note: needs a static analysis platform
  rating:
    adapter: manual
    status: todo
    note: needs a static analysis platform

  # --- supply chain: nothing is signed or attested yet, and that is a fact, not an unknown
  signed:
    adapter: manual
    status: owned
    note: false until a signing step exists in the release stage
  sbom:
    adapter: manual
    status: owned
    note: false until the build publishes one
  slsa:
    adapter: manual
    status: owned
    note: 0 until provenance is generated by a trusted builder
  outdated:
    adapter: manual
    status: todo
    note: needs Dependabot version updates or a dependency scanner
  runbook:
    adapter: manual
    status: owned
    note: link exists or it does not; a human asserts which
